name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    name: Soroban Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/escrow -> target
      - name: Run Contract Tests
        run: |
          cd contracts/escrow
          cargo test --verbose

  sdk:
    name: TypeScript SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'packages/sdk/package-lock.json'
      - name: Install Dependencies
        run: npm ci --prefix packages/sdk
      - name: Build SDK
        run: npm run build --prefix packages/sdk
      - name: Run SDK Tests
        run: npm test --prefix packages/sdk

