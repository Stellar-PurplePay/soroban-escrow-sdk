name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    name: Soroban Smart Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/escrow -> target

      - name: Format check
        run: cargo fmt --check
        working-directory: contracts/escrow

      - name: Clippy check
        run: cargo clippy --all-targets -- -D warnings
        working-directory: contracts/escrow

      - name: Unit & Integration tests
        run: cargo test --verbose
        working-directory: contracts/escrow

      - name: Build contract WASM (production release)
        run: cargo build --target wasm32v1-none --release
        working-directory: contracts/escrow

  sdk:
    name: TypeScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build SDK
        run: npm run build:sdk

      - name: Run SDK Tests
        run: npm run test:sdk

      - name: Dependency Audit
        run: npm audit --omit=dev --audit-level=critical
